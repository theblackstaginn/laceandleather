name: L&L Studio stage metadata for visual review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ll-studio-metadata-batches.yml"
  schedule:
    # Runs only from default branch; prepares review branches, never deploys assets.
    # October 20: batch ten passed individual visual review; stage batch eleven next.
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ll-studio-visual-review-queue
  cancel-in-progress: false

jobs:
  stage-one-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main (leave live assets untouched)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Pause while a previous image batch awaits visual inspection
        id: gate
        shell: bash
        run: |
          count=$(gh pr list --state open --base main --json headRefName --jq '[.[] | select(.headRefName | startswith("ll-studio-visual-"))] | length')
          waiting_branch=0
          # GitHub Actions cannot create PRs in this repo. Hold if a staging
          # branch is awaiting ChatGPT's connected GitHub review.
          branches=$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate --jq '.[].name' | grep '^ll-studio-visual-' || true)
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            merged_count=$(gh pr list --state merged --head "$candidate" --json number --jq 'length')
            if [ "$merged_count" -eq 0 ]; then
              echo "Unreviewed staging branch: $candidate"
              waiting_branch=1
            fi
          done <<< "$branches"
          if [ "$count" -gt 0 ] || [ "$waiting_branch" -gt 0 ]; then
            echo "An image batch still awaits actual visual approval. Holding next batch."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EXIF and pixel-integrity validators
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Create isolated batch branch and process up to 12 images
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          git switch -c "ll-studio-visual-$GITHUB_RUN_ID"
          python studio/ll_metadata_batches.py \
            --policy studio/batch-policy.json \
            --ledger studio/batch-ledger.json \
            --summary studio/batch-last-result.json

      - name: Verify audited files and changed paths
        if: steps.gate.outputs.ready == 'true'
        run: |
          git diff --check
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path.cwd()
          summary=json.loads(Path("studio/batch-last-result.json").read_text())
          ledger=json.loads(Path("studio/batch-ledger.json").read_text())
          policy=json.loads(Path("studio/batch-policy.json").read_text())
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          approved_source_dirs=tuple(policy["allowlisted_public_paths"])
          images=summary["updated_paths"]
          assert len(images)<=12 and len(images)==summary["retrofitted_this_run"]
          allowed_changes=set(images)|{"studio/batch-ledger.json","studio/batch-last-result.json"}
          assert changed.issubset(allowed_changes),f"Unapproved changed paths: {changed-allowed_changes}"
          assert set(images).issubset(changed),f"Expected processed images absent from git diff: {set(images)-changed}"
          assert summary["live_site_image_code_changed"] is False
          for name in images:
              assert name.startswith(approved_source_dirs)
              record=ledger["records"][name]
              assert record["status"]=="verified_metadata_only"
              assert record["pixels_alpha_frames_profile_unchanged"] is True
              assert record["compressed_picture_data_unchanged"] is True
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==record["sha256"]
          print("Metadata/pixels verified. VISUAL REVIEW STILL REQUIRED:",len(images))
          PY

      - name: Commit only to new staging branch
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        id: push
        run: |
          git config user.name "L&L Studio Metadata Bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          summary=json.loads(Path("studio/batch-last-result.json").read_text())
          subprocess.run(["git","add","--",*summary["updated_paths"],
                          "studio/batch-ledger.json","studio/batch-last-result.json"],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No eligible assets need changes."
            echo "new_batch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "stage: L&L images pending per-image visual inspection"
          git push origin "HEAD:refs/heads/ll-studio-visual-$GITHUB_RUN_ID"
          echo "new_batch=true" >> "$GITHUB_OUTPUT"

      - name: Hand staged branch to visual inspection queue
        if: steps.gate.outputs.ready == 'true' && steps.push.outputs.new_batch == 'true'
        shell: bash
        run: |
          echo "STAGED BRANCH: ll-studio-visual-$GITHUB_RUN_ID"
          echo "This branch contains verified metadata-only file changes."
          echo "NEXT: Connected GitHub reviewer opens a PR, renders every original"
          echo "and staged image, logs per-image approval or hold with hashes,"
          echo "then merges only individually approved art."
          echo "STOP: GitHub Actions never merges or deploys the batch."
