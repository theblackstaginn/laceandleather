name: TEMP Build Bookmaker Etsy gallery
run-name: TEMP Bookmaker Etsy gallery cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/etsy-bookmaker-gallery-temp.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download protected ornament source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p inputs
          download_artifact () {
            id="$1"
            name="$2"
            curl -L --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "inputs/$name.zip"
          }
          download_artifact 11817020648 lantern
          download_artifact 11816034396 wax-key
          download_artifact 11817290565 red-wax-feather
          download_artifact 11816183599 purple-wax-crystal
          download_artifact 11817215487 grn-wax-book
          download_artifact 11816850965 wax-green-book-2
          download_artifact 11815903970 moon-parch-clean
          download_artifact 11816073994 amber-bronze
          download_artifact 11815634469 ruby-plate
          download_artifact 11817085841 stag-red-wax

      - name: Build flattened Etsy marketing cards
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          import zipfile, math

          OUT = Path("assets/etsy-previews/bookmaker")
          OUT.mkdir(parents=True, exist_ok=True)
          W = H = 2600
          BG = (27, 16, 12)
          BG2 = (38, 24, 17)
          IVORY = (244, 226, 194)
          COPPER = (177, 100, 55)
          MUTED = (211, 189, 158)
          BLACK = (10, 7, 5)
          font_serif = "/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"
          font_bold = "/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"

          specs = [
            ("lantern","lantern.png","Lantern"),
            ("wax-key","wax-key.png","Wax Key"),
            ("red-wax-feather","red-wax-feather.png","Red Wax Feather"),
            ("purple-wax-crystal","purple-wax-crystal.png","Purple Wax Crystal"),
            ("grn-wax-book","grn-wax-book.png","Green Wax Book"),
            ("wax-green-book-2","wax-green-book-2.png","Green Wax Book II"),
            ("moon-parch-clean","moon-parch-clean.png","Moon Parchment"),
            ("amber-bronze","amber-bronze.png","Amber Bronze"),
            ("ruby-plate","ruby-plate.png","Ruby Plate"),
            ("stag-red-wax","stag-red-wax.png","Stag Red Wax"),
          ]

          assets = {}
          for artifact_name, basename, label in specs:
              with zipfile.ZipFile(Path("inputs") / f"{artifact_name}.zip") as z:
                  member = next(n for n in z.namelist() if n.lower().endswith("/"+basename.lower()) or n.lower()==basename.lower())
                  with z.open(member) as f:
                      im = Image.open(f).convert("RGBA")
                      im.load()
              assets[basename] = (im, label)

          def font(path, size):
              return ImageFont.truetype(path, size)

          def fit_text(draw, text, path, max_size, min_size, max_width):
              for sz in range(max_size, min_size-1, -2):
                  f = font(path, sz)
                  b = draw.textbbox((0,0), text, font=f)
                  if b[2]-b[0] <= max_width:
                      return f
              return font(path, min_size)

          def paste_asset(base, im, center, max_box, shadow=True):
              scale = min(max_box[0]/im.width, max_box[1]/im.height)
              size = (max(1, round(im.width*scale)), max(1, round(im.height*scale)))
              item = im.resize(size, Image.Resampling.LANCZOS)
              x = round(center[0]-size[0]/2)
              y = round(center[1]-size[1]/2)
              if shadow:
                  alpha = item.getchannel("A")
                  sh = Image.new("RGBA", base.size, (0,0,0,0))
                  blur = alpha.filter(ImageFilter.GaussianBlur(24))
                  shadow_img = Image.new("RGBA", item.size, (0,0,0,170))
                  shadow_img.putalpha(blur.point(lambda p: int(p*0.65)))
                  sh.alpha_composite(shadow_img, (x+24,y+28))
                  base.alpha_composite(sh)
              base.alpha_composite(item, (x,y))

          def top_rule(draw):
              draw.line((290, 365, 2310, 365), fill=COPPER, width=3)

          def footer_box(draw, text):
              box=(420,2180,2180,2395)
              draw.rounded_rectangle(box, radius=24, fill=BLACK, outline=COPPER, width=3)
              f=fit_text(draw,text,font_bold,50,34,1550)
              b=draw.textbbox((0,0),text,font=f)
              draw.text(((W-(b[2]-b[0]))/2,2260),text,font=f,fill=IVORY)

          # HERO
          base=Image.new("RGBA",(W,H),BG+(255,))
          d=ImageDraw.Draw(base)
          title1="OLD-WORLD BOOKMAKER"
          title2="STICKERS & SEALS"
          f1=fit_text(d,title1,font_bold,115,80,2050)
          f2=fit_text(d,title2,font_bold,115,80,2050)
          for text,y,f in [(title1,180,f1),(title2,310,f2)]:
              b=d.textbbox((0,0),text,font=f)
              d.text(((W-(b[2]-b[0]))/2,y),text,font=f,fill=IVORY)
          top_rule(d)
          sub="10 TRANSPARENT ARCANE PNG ASSETS"
          fs=fit_text(d,sub,font_serif,52,36,1850)
          b=d.textbbox((0,0),sub,font=fs)
          d.text(((W-(b[2]-b[0]))/2,405),sub,font=fs,fill=COPPER)

          hero_items=[
              ("lantern.png",(650,1180),(660,650)),
              ("red-wax-feather.png",(1300,1130),(760,800)),
              ("grn-wax-book.png",(1970,1180),(690,720)),
              ("amber-bronze.png",(920,1730),(710,460)),
              ("stag-red-wax.png",(1690,1730),(710,470)),
          ]
          for name,c,box in hero_items:
              paste_asset(base,assets[name][0],c,box)
          d=ImageDraw.Draw(base)
          footer_box(d,"3400 PX LONG EDGE  |  TRANSPARENT PNG  |  300 DPI")
          base.convert("RGB").save(OUT/"bookmaker-01-hero.jpg","JPEG",quality=94,subsampling=0,optimize=True)

          # CONTENTS
          base=Image.new("RGBA",(W,H),BG+(255,))
          d=ImageDraw.Draw(base)
          title="10 OLD-WORLD EMBELLISHMENTS"
          ft=fit_text(d,title,font_bold,104,70,2150)
          b=d.textbbox((0,0),title,font=ft)
          d.text(((W-(b[2]-b[0]))/2,135),title,font=ft,fill=IVORY)
          st="TRANSPARENT PNG  •  HIGH-RESOLUTION"
          fs=fit_text(d,st,font_serif,52,34,1800)
          b=d.textbbox((0,0),st,font=fs)
          d.text(((W-(b[2]-b[0]))/2,280),st,font=fs,fill=COPPER)
          top_rule(d)

          names=[x[1] for x in specs]
          centers=[]
          xs=[330,815,1300,1785,2270]
          for y in [820,1560]:
              centers += [(x,y) for x in xs]
          for name,c in zip(names,centers):
              paste_asset(base,assets[name][0],c,(390,480))
          d=ImageDraw.Draw(base)
          footer_box(d,"10 UNIQUE ASSETS  •  ORIGINAL PROPORTIONS PRESERVED")
          base.convert("RGB").save(OUT/"bookmaker-02-contents.jpg","JPEG",quality=94,subsampling=0,optimize=True)

          # SPECS / USE
          base=Image.new("RGBA",(W,H),BG+(255,))
          d=ImageDraw.Draw(base)
          title="MADE FOR REAL PROJECTS"
          ft=fit_text(d,title,font_bold,110,76,2000)
          b=d.textbbox((0,0),title,font=ft)
          d.text(((W-(b[2]-b[0]))/2,130),title,font=ft,fill=IVORY)
          st="BOOKMAKER EMBELLISHMENTS"
          fs=fit_text(d,st,font_serif,54,36,1700)
          b=d.textbbox((0,0),st,font=fs)
          d.text(((W-(b[2]-b[0]))/2,285),st,font=fs,fill=COPPER)
          top_rule(d)

          # left mockup card
          paper=(245,214,167)
          paper_box=(220,590,1170,1940)
          d.rounded_rectangle(paper_box,radius=12,fill=paper,outline=(100,60,35),width=4)
          # subtle paper ruling / texture
          for y in range(650,1900,55):
              d.line((275,y,1110,y),fill=(225,190,143),width=1)
          paste_asset(base,assets["ruby-plate.png"][0],(695,1270),(680,430))
          fb=font(font_serif,28)
          label="LACE & LEATHER ARCANE"
          b=d.textbbox((0,0),label,font=fb)
          d.text((695-(b[2]-b[0])/2,1855),label,font=fb,fill=(87,52,31))

          x=1280
          sections=[
              ("TRANSPARENT PNG","Ten individual assets rebuilt to a 3400px long-edge\nstandard, with transparent backgrounds preserved."),
              ("OLD-WORLD DETAILS","Wax seals, parchment, brass and bookish emblems."),
              ("DROP INTO PROJECTS","Perfect for journals, grimoire layouts, stationery, collage\nand TTRPG handouts."),
              ("DELIVERY","Four high-res ZIP parts plus the original-scale legacy ZIP\nas a bonus/reference copy."),
          ]
          y=650
          fh=font(font_bold,50)
          fp=font(font_serif,36)
          for head,body in sections:
              d.text((x,y),head,font=fh,fill=COPPER)
              d.multiline_text((x,y+82),body,font=fp,fill=MUTED,spacing=14)
              y += 315
          footer_box(d,"PERSONAL + COMMERCIAL USE IN FINISHED PROJECTS")
          base.convert("RGB").save(OUT/"bookmaker-03-specs.jpg","JPEG",quality=94,subsampling=0,optimize=True)

          # Sanity check.
          for p in sorted(OUT.glob("bookmaker-*.jpg")):
              with Image.open(p) as im:
                  assert im.size == (2600,2600)
                  im.verify()
              print(p, p.stat().st_size)
          PY

      - name: Commit marketing-only Etsy previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/etsy-previews/bookmaker/
          if ! git diff --cached --quiet; then
            git commit -m "assets(etsy): add Bookmaker listing gallery previews [skip ci]"
            git push origin HEAD:main
          fi
