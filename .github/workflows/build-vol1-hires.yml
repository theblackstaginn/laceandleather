name: Build Parchment Light Vol 1 high-res Etsy files

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_vol1_hires.py"
      - "assets/vol-one/**"
      - ".github/workflows/build-vol1-hires.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Build high-resolution Etsy files
        run: python scripts/build_vol1_hires.py

      - name: Upload high-resolution package
        uses: actions/upload-artifact@v4
        with:
          name: parchment-light-vol-1-hires
          path: vol1-hires/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
