name: Build branded Pinterest preview exports

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_pinterest_exports.py"
      - "marketing/pinterest/pin-plan.json"
      - ".github/workflows/build-pinterest-exports.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lace-leather-pinterest-preview-exports
  cancel-in-progress: false

jobs:
  build-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the image library
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Build images from public Etsy listing previews
        run: |
          python scripts/build_pinterest_exports.py \
            --manifest marketing/pinterest/pin-plan.json \
            --out marketing/pinterest/exports

      - name: Verify the entire batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base = Path("marketing/pinterest/exports")
          report = json.loads((base / "metadata-audit.json").read_text(encoding="utf-8"))
          assert report["total"] == 57, "Expected all 57 Pinterest previews"
          assert len(report["records"]) == 57
          assert len({x["pin_uuid"] for x in report["records"]}) == 57
          for row in report["records"]:
              image_path = base / row["file"]
              assert image_path.is_file(), str(image_path)
              with Image.open(image_path) as im:
                  tags = im.getexif()
                  assert im.format == "JPEG"
                  assert tags.get(315) == "Lace & Leather Arcane"
                  assert tags.get(33432) == "Copyright 2026 Lace & Leather Arcane"
                  assert "laceleatherarcane.com" in str(tags.get(270, ""))
                  assert "etsy.com/shop/laceLeatherArcane" in str(tags.get(270, ""))
                  assert set(tags).issubset({270, 305, 315, 33432})
          print("Verified 57 public-preview exports and their metadata")
          PY

      - name: Commit verified Pinterest marketing exports
        run: |
          git config user.name "Lace & Leather Artwork Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- marketing/pinterest/exports
          if git diff --cached --quiet; then
            echo "Pinterest preview exports are already current."
            exit 0
          fi
          git commit -m "chore: refresh branded Pinterest preview exports"
          git push
