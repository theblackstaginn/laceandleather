name: Build Stripe logo

on:
  push:
    paths:
      - '.github/workflows/build-stripe-logo.yml'

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build lightweight PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('assets/l&l_logo.png')
          out = Path('assets/l&l_logo_stripe.png')
          limit = 512 * 1024

          img = Image.open(src).convert('RGBA')

          attempts = [
              (512, 256),
              (512, 128),
              (448, 128),
              (384, 128),
              (384, 64),
              (320, 64),
          ]

          for size, colors in attempts:
              work = img.copy()
              work.thumbnail((size, size), Image.Resampling.LANCZOS)
              q = work.quantize(colors=colors, method=Image.Quantize.FASTOCTREE)
              q.save(out, format='PNG', optimize=True)
              n = out.stat().st_size
              print(f'{size}px/{colors} colors -> {n} bytes')
              if n < limit:
                  break
          else:
              raise SystemExit('Could not get logo below 512 KB')

          print(f'Final: {out} = {out.stat().st_size} bytes')
          PY

      - name: Commit compressed logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assets/l&l_logo_stripe.png'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add lightweight Lace & Leather logo for Stripe"
            git push
          fi
