name: Build Smithy High Resolution V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-smithy-highres-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python scripts/fix_smithy8.py
      - run: cp smithy-8-clean.png assets/smithy/smithy-8.png
      - run: python scripts/build_smithy_hires.py
      - run: python scripts/qa_smithy_edges.py
      - run: python scripts/build_smithy_site.py
      - run: git checkout -- assets/smithy/smithy-8.png
      - name: Publish generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/smithy-hires
          git diff --cached --quiet || git commit -m "Build full-bleed high-resolution Smithy assets"
          git push
