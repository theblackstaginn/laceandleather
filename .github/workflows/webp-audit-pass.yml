# Registration nudge: 2026-10-13
name: Lace & Leather WebP audit pass

on:
  push:
    paths:
      - ".github/workflows/webp-audit-pass.yml"
      - "scripts/webp_sitewide_pass.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate WebP siblings and audit
        run: python scripts/webp_sitewide_pass.py

      - name: Commit generated audit branch changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes generated."
            exit 0
          fi
          git config user.name "Ember WebP Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Optimize Lace & Leather image delivery [webp-pass]"
          git push origin HEAD:"$GITHUB_REF_NAME"
