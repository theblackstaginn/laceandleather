name: TEMP Build Grimoire Etsy sample cards
run-name: TEMP Grimoire Etsy sample cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/etsy-grimoire-samples-temp.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build five sample cards
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path

          W=H=2600
          BG=(24,14,11)
          IVORY=(244,226,194)
          COPPER=(177,100,55)
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"
          BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"
          out=Path("assets/etsy-previews/grimoire-vol-3/samples")
          out.mkdir(parents=True,exist_ok=True)

          for i in range(1,6):
              src=Path(f"assets/previews/grimoire/grimoire-{i:02d}-preview.webp")
              im=Image.open(src).convert("RGBA"); im.load()
              base=Image.new("RGBA",(W,H),BG+(255,))
              d=ImageDraw.Draw(base)
              title=f"GRIMOIRE TEXTURE SAMPLE {i:02d}"
              f=ImageFont.truetype(BOLD,82)
              b=d.textbbox((0,0),title,font=f)
              d.text(((W-(b[2]-b[0]))/2,125),title,font=f,fill=IVORY)
              d.line((350,270,2250,270),fill=COPPER,width=3)

              # Large centered sample, intentionally framed and not presented as a downloadable master.
              maxw,maxh=1450,1850
              scale=min(maxw/im.width,maxh/im.height)
              size=(round(im.width*scale),round(im.height*scale))
              sample=im.resize(size,Image.Resampling.LANCZOS)
              alpha=sample.getchannel("A")
              blur=alpha.filter(ImageFilter.GaussianBlur(24))
              sh=Image.new("RGBA",sample.size,(0,0,0,165)); sh.putalpha(blur.point(lambda p:int(p*.55)))
              x=(W-size[0])//2; y=360+(1850-size[1])//2
              base.alpha_composite(sh,(x+24,y+28))
              base.alpha_composite(sample,(x,y))

              d=ImageDraw.Draw(base)
              box=(430,2280,2170,2440)
              d.rounded_rectangle(box,radius=22,fill=(8,6,5),outline=COPPER,width=3)
              text="WATERMARKED PREVIEW  •  FULL-RES FILE INCLUDED WITH PURCHASE"
              f2=ImageFont.truetype(FONT,34)
              b=d.textbbox((0,0),text,font=f2)
              d.text(((W-(b[2]-b[0]))/2,2335),text,font=f2,fill=IVORY)

              p=out/f"grimoire-vol-3-sample-{i:02d}.jpg"
              base.convert("RGB").save(p,"JPEG",quality=94,subsampling=0,optimize=True)
              with Image.open(p) as chk:
                  assert chk.size==(2600,2600)
                  chk.verify()
              print(p,p.stat().st_size)
          PY

      - name: Commit marketing-only sample cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/etsy-previews/grimoire-vol-3/samples
          if ! git diff --cached --quiet; then
            git commit -m "assets(etsy): add Grimoire sample cards [skip ci]"
            git push origin HEAD:main
          fi
