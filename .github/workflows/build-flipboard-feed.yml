name: Build Flipboard RSS feed

on:
  push:
    branches: [main]
    paths:
      - 'journal/**'
      - 'index.html'
      - 'buttons.html'
      - 'smithy-textures.html'
      - 'grimoire-pages.html'
      - 'mapmaker-sheets.html'
      - 'light-aged-parchment-vol-1.html'
      - 'use-case.html'
      - 'scripts/build_flipboard_feed.py'
      - '.github/workflows/build-flipboard-feed.yml'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Flipboard feed
        run: python scripts/build_flipboard_feed.py

      - name: Commit feed when it changed
        shell: bash
        run: |
          if git diff --quiet -- feed.xml; then
            echo 'feed.xml is already current.'
            exit 0
          fi
          git config user.name 'Lace & Leather Feed Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add feed.xml
          git commit -m 'chore: refresh Flipboard RSS feed'
          git push
