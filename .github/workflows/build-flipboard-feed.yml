name: Build Flipboard RSS feed

on:
  push:
    branches: [main]
    paths:
      - 'journal/**'
      - 'index.html'
      - 'buttons.html'
      - 'smithy-textures.html'
      - 'grimoire-pages.html'
      - 'grimoire-journal-pages.html'
      - 'mapmaker-sheets.html'
      - 'light-aged-parchment-vol-1.html'
      - 'parchment-light-vol-2.html'
      - 'illuminated-manuscripts-vol-1.html'
      - 'bookmaker-stickers-seals-vol-1.html'
      - 'gui-packs.html'
      - 'use-case.html'
      - 'scripts/build_flipboard_feed.py'
      - '.github/workflows/build-flipboard-feed.yml'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flipboard-feed-main
  cancel-in-progress: true

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and publish current feed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'Lace & Leather Feed Bot'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Feed publish attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            python scripts/build_flipboard_feed.py

            if git diff --quiet -- feed.xml; then
              echo 'feed.xml is already current.'
              exit 0
            fi

            git add feed.xml
            git commit -m 'chore: refresh Flipboard RSS feed'

            if git push origin HEAD:main; then
              exit 0
            fi

            echo 'main changed during feed generation; rebuilding from the newest commit.'
          done

          echo 'Could not publish feed after 3 attempts.'
          exit 1
