name: TEMP Build Mapmakers and Journal Etsy galleries
run-name: TEMP Mapmakers + Journal Etsy gallery cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/etsy-mapmakers-journal-gallery-temp.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build flattened marketing cards from existing public Etsy previews
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          from io import BytesIO
          import urllib.request

          W=H=2600
          IVORY=(244,226,194)
          COPPER=(177,100,55)
          MUTED=(211,189,158)
          BLACK=(9,7,5)
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"
          BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"

          def fnt(path,size): return ImageFont.truetype(path,size)
          def fit(draw,text,path,max_size,min_size,max_width):
              for s in range(max_size,min_size-1,-2):
                  f=fnt(path,s); b=draw.textbbox((0,0),text,font=f)
                  if b[2]-b[0] <= max_width: return f
              return fnt(path,min_size)

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 LaceLeatherPreviewBuilder/1.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  im=Image.open(BytesIO(r.read())).convert("RGBA")
                  im.load()
              return im

          def shadow_paste(base,im,center,box,angle=0):
              if angle:
                  im=im.rotate(angle,Image.Resampling.BICUBIC,expand=True)
              scale=min(box[0]/im.width,box[1]/im.height)
              size=(max(1,round(im.width*scale)),max(1,round(im.height*scale)))
              im=im.resize(size,Image.Resampling.LANCZOS)
              x=round(center[0]-size[0]/2); y=round(center[1]-size[1]/2)
              alpha=im.getchannel("A")
              blur=alpha.filter(ImageFilter.GaussianBlur(18))
              sh=Image.new("RGBA",im.size,(0,0,0,155)); sh.putalpha(blur.point(lambda p:int(p*.55)))
              base.alpha_composite(sh,(x+20,y+24))
              base.alpha_composite(im,(x,y))

          def header(draw,title,subtitle):
              ft=fit(draw,title,BOLD,108,68,2160)
              b=draw.textbbox((0,0),title,font=ft)
              draw.text(((W-(b[2]-b[0]))/2,130),title,font=ft,fill=IVORY)
              fs=fit(draw,subtitle,FONT,52,34,1900)
              b=draw.textbbox((0,0),subtitle,font=fs)
              draw.text(((W-(b[2]-b[0]))/2,285),subtitle,font=fs,fill=COPPER)
              draw.line((290,380,2310,380),fill=COPPER,width=3)

          def footer(draw,text):
              box=(350,2180,2250,2395)
              draw.rounded_rectangle(box,radius=24,fill=BLACK,outline=COPPER,width=3)
              f=fit(draw,text,BOLD,46,29,1700)
              b=draw.textbbox((0,0),text,font=f)
              draw.text(((W-(b[2]-b[0]))/2,2257),text,font=f,fill=IVORY)

          def build(slug,title,subtitle,urls,spec_line,sections,bg,contents_count=None):
              out=Path("assets/etsy-previews")/slug
              out.mkdir(parents=True,exist_ok=True)
              ims=[get(u) for u in urls]
              count=contents_count or len(ims)

              # Hero
              base=Image.new("RGBA",(W,H),bg+(255,))
              d=ImageDraw.Draw(base)
              header(d,title,subtitle)
              chosen=[ims[0],ims[len(ims)//3],ims[(2*len(ims))//3],ims[-1]]
              fan=[
                ((740,1280),(720,1080),-10),
                ((1120,1200),(740,1110),-4),
                ((1510,1200),(740,1110),4),
                ((1890,1280),(720,1080),10),
              ]
              for im,(c,box,a) in zip(chosen,fan): shadow_paste(base,im,c,box,a)
              d=ImageDraw.Draw(base); footer(d,spec_line)
              base.convert("RGB").save(out/f"{slug}-01-hero.jpg","JPEG",quality=94,subsampling=0,optimize=True)

              # Contents
              base=Image.new("RGBA",(W,H),bg+(255,))
              d=ImageDraw.Draw(base)
              header(d,f"{count} INCLUDED DESIGNS","A CLOSER LOOK AT THE COLLECTION")
              cols=5
              # fit up to 15 small previews across 3 rows; journal uses two rows
              rows=(len(ims)+cols-1)//cols
              if rows==3:
                  ys=[730,1280,1830]
                  box=(330,455)
              else:
                  ys=[900,1600]
                  box=(390,540)
              xs=[310,805,1300,1795,2290]
              k=0
              for y in ys:
                  for x in xs:
                      if k>=len(ims): break
                      shadow_paste(base,ims[k],(x,y),box,0)
                      k+=1
              d=ImageDraw.Draw(base); footer(d,"PREVIEW IMAGES  •  FULL-RES FILES INCLUDED WITH PURCHASE")
              base.convert("RGB").save(out/f"{slug}-02-contents.jpg","JPEG",quality=94,subsampling=0,optimize=True)

              # Specs/use
              base=Image.new("RGBA",(W,H),bg+(255,))
              d=ImageDraw.Draw(base)
              header(d,"BUILT FOR CREATIVE WORK",subtitle)
              d.rounded_rectangle((210,600,1160,1950),radius=18,fill=(219,189,143),outline=(104,62,34),width=4)
              shadow_paste(base,ims[min(1,len(ims)-1)],(685,1260),(760,1150),0)
              x=1270; y=625; fh=fnt(BOLD,48); fp=fnt(FONT,34)
              for head,body in sections:
                  d.text((x,y),head,font=fh,fill=COPPER)
                  d.multiline_text((x,y+80),body,font=fp,fill=MUTED,spacing=13)
                  y+=315
              footer(d,"PERSONAL + COMMERCIAL USE IN FINISHED PROJECTS")
              base.convert("RGB").save(out/f"{slug}-03-specs.jpg","JPEG",quality=94,subsampling=0,optimize=True)

              for p in sorted(out.glob("*.jpg")):
                  with Image.open(p) as im:
                      assert im.size==(2600,2600)
                      im.verify()
                  print(p,p.stat().st_size)

          map_urls=[
            "https://i.etsystatic.com/63811998/r/il/9dea08/7574982314/il_fullxfull.7574982314_td4o.jpg",
            "https://i.etsystatic.com/63811998/r/il/c6ee89/7574982302/il_fullxfull.7574982302_lo6n.jpg",
            "https://i.etsystatic.com/63811998/r/il/ed9823/7574982284/il_fullxfull.7574982284_eqse.jpg",
            "https://i.etsystatic.com/63811998/r/il/908de8/7622928917/il_fullxfull.7622928917_3ljd.jpg",
            "https://i.etsystatic.com/63811998/r/il/5c1c98/7574982534/il_fullxfull.7574982534_oswj.jpg",
            "https://i.etsystatic.com/63811998/r/il/b02212/7574982562/il_fullxfull.7574982562_4c7b.jpg",
            "https://i.etsystatic.com/63811998/r/il/95284c/7574982564/il_fullxfull.7574982564_l277.jpg",
            "https://i.etsystatic.com/63811998/r/il/52c190/7574982614/il_fullxfull.7574982614_5cfu.jpg",
            "https://i.etsystatic.com/63811998/r/il/769cf7/7574982590/il_fullxfull.7574982590_ah0x.jpg",
            "https://i.etsystatic.com/63811998/r/il/0109c2/7574982588/il_fullxfull.7574982588_pt80.jpg",
            "https://i.etsystatic.com/63811998/r/il/a4262f/7622929283/il_fullxfull.7622929283_ak1r.jpg",
            "https://i.etsystatic.com/63811998/r/il/b31f2e/7574982722/il_fullxfull.7574982722_a0wj.jpg",
            "https://i.etsystatic.com/63811998/r/il/a4068b/7574982714/il_fullxfull.7574982714_6dwx.jpg",
            "https://i.etsystatic.com/63811998/r/il/6c431b/7574982282/il_fullxfull.7574982282_gm61.jpg",
            "https://i.etsystatic.com/63811998/r/il/7f0884/7574982310/il_fullxfull.7574982310_nzjm.jpg"
          ]
          build(
            "mapmakers",
            "MAPMAKERS PARCHMENT",
            "OLD-WORLD CARTOGRAPHY TEXTURES",
            map_urls,
            "15 TEXTURES  |  3600 x 5400  |  300 DPI",
            [
              ("HIGH-RES COLLECTION","Fifteen aged parchment textures at 3600 × 5400 pixels\nand 300 DPI."),
              ("CARTOGRAPHER'S CHARACTER","Weathered paper, subtle grain and old-atlas atmosphere\nwithout overwhelming your mapwork."),
              ("MADE FOR","Fantasy maps, TTRPG handouts, journals, lore pages,\nworldbuilding and printable design."),
              ("DELIVERY","Five ZIP files containing the complete high-resolution set."),
            ],
            (26,17,12),15
          )

          journal_urls=[
            "https://i.etsystatic.com/63811998/r/il/5ee64a/7557238192/il_fullxfull.7557238192_dxml.jpg",
            "https://i.etsystatic.com/63811998/r/il/117b43/7557238200/il_fullxfull.7557238200_9btd.jpg",
            "https://i.etsystatic.com/63811998/r/il/3fc7e9/7557238202/il_fullxfull.7557238202_h8r3.jpg",
            "https://i.etsystatic.com/63811998/r/il/96a6ce/7605179731/il_fullxfull.7605179731_shtd.jpg",
            "https://i.etsystatic.com/63811998/r/il/1c535b/7605179727/il_fullxfull.7605179727_9q92.jpg",
            "https://i.etsystatic.com/63811998/r/il/e72390/7557238196/il_fullxfull.7557238196_d8k3.jpg",
            "https://i.etsystatic.com/63811998/r/il/0db5b9/7557238194/il_fullxfull.7557238194_68pz.jpg"
          ]
          build(
            "journal-pages",
            "GRIMOIRE JOURNAL PAGES",
            "PRINTABLE AGED PARCHMENT PAGES",
            journal_urls,
            "8 PAGES  |  3600 x 5400  |  300 DPI  |  PDF",
            [
              ("HIGH-RES PAGES","Eight printable pages at 3600 × 5400 pixels and 300 DPI,\nplus a print-ready 8-page PDF."),
              ("READY TO WRITE ON","Aged grimoire styling with practical layouts for notes,\nrituals, intentions and daily entries."),
              ("MADE FOR","Book of Shadows pages, tarot journals, ritual records,\nfantasy journaling and printable planners."),
              ("DELIVERY","Two high-resolution ZIP parts plus the 8-page PDF."),
            ],
            (28,18,13),8
          )
          PY

      - name: Commit marketing-only preview cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/etsy-previews/mapmakers assets/etsy-previews/journal-pages
          if ! git diff --cached --quiet; then
            git commit -m "assets(etsy): refresh Mapmakers and Journal galleries [skip ci]"
            git push origin HEAD:main
          fi
