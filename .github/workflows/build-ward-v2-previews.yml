name: Build Ward v2 Smithy previews (draft)
run-name: Build baked-watermark Smithy preview images
on:
  push:
    branches:
      - security/ward-v2-previews-20261016
    paths:
      - scripts/build_ward_previews.py
      - .github/workflows/build-ward-v2-previews.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ward-v2-smithy-previews
  cancel-in-progress: false

# SECURITY HOLD: preview build completed; never rerun against deleted source art.
jobs:
  generate:
    if: ${{ false }}
    name: Build and verify all twelve previews
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ward v2 draft branch
        uses: actions/checkout@v4
        with:
          ref: security/ward-v2-previews-20261016
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate reduced watermarked WebP previews
        run: python scripts/build_ward_previews.py --pack smithy
      - name: Verify exactly twelve previews with baked-in pixel watermarks
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('assets/previews/smithy')
          files=sorted(root.glob('smithy-??-preview.webp'))
          assert len(files)==12,(len(files), files)
          data=json.loads((root/'preview-manifest.json').read_text())
          assert len(data['files'])==12
          for path in files:
              im=Image.open(path)
              assert im.format=='WEBP'
              assert im.mode=='RGB'
              assert max(im.size)<=1500
              assert path.stat().st_size < 1_000_000
          print('PASS: twelve flattened, reduced WebP previews')
          PY
      - name: Commit only public preview derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/smithy/
          if ! git diff --cached --quiet; then
            git commit -m "assets(ward): add twelve baked-watermark Smithy previews [skip ci]"
            git push origin HEAD:security/ward-v2-previews-20261016
          else
            echo "No preview changes to commit"
          fi
