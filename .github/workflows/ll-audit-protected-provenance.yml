name: Audit protected provenance originals

on:
  push:
    branches:
      - ll-provenance-audit-protected-originals-v2-20261020
    paths:
      - ".github/workflows/ll-audit-protected-provenance.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata reader
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libimage-exiftool-perl
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Audit protected originals without modifying them
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          from PIL import Image

          ROOT=Path(".").resolve()
          sys.path.insert(0,str(ROOT/"studio"))
          from ll_metadata_pilot import exiftool_metadata, has_authenticity_credentials, has_conflicting_rights

          targets=[
              "assets/grimoire/grim-thumb.png",
              "assets/mapmaker/mapmaker-cover.png",
              "assets/vol-one/vol-1-thumbnail.png",
              "commission-modal-assets/map-slot-button.png",
              "commission-modal-assets/modal-bg.png",
              "itch-assets/bookmaker-cover-source.png",
          ]

          interesting_tokens=(
              "c2pa","jumbf","contentcredential","contentsummary","digitalsourcetype",
              "creator","artist","credit","copyright","rights","licensor",
              "usageterms","software","historysoftwareagent","creatortool",
          )

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def grep_refs(needle):
              cmd=["git","grep","-n","-I","-F",needle,"--",":!studio/*",":!.github/*"]
              p=subprocess.run(cmd,capture_output=True,text=True)
              if p.returncode not in (0,1):
                  raise RuntimeError(p.stderr)
              return [line for line in p.stdout.splitlines() if line.strip()]

          records=[]
          for rel in targets:
              path=ROOT/rel
              if not path.is_file():
                  raise RuntimeError(f"Missing protected source: {rel}")
              raw=path.read_bytes()
              meta=exiftool_metadata(path)
              with Image.open(path) as im:
                  im.load()
                  image_info={"format":im.format,"size":list(im.size),"mode":im.mode}

              relevant={}
              for key,value in sorted(meta.items()):
                  normalized=key.lower().replace("-","").replace("_","")
                  if any(tok in normalized for tok in interesting_tokens):
                      relevant[key]=value

              basename=Path(rel).name
              sibling=Path(rel).with_suffix(".webp").as_posix()
              sibling_path=ROOT/sibling
              full_refs=grep_refs(rel)
              name_refs=grep_refs(basename)
              references=sorted(set(full_refs+name_refs))

              records.append({
                  "path":rel,
                  "sha256":sha(path),
                  "bytes":path.stat().st_size,
                  "image":image_info,
                  "authenticity_credentials_detected":has_authenticity_credentials(raw,meta),
                  "conflicting_creator_or_rights_fields":has_conflicting_rights(meta),
                  "relevant_metadata":relevant,
                  "non_audit_repository_references":references,
                  "referenced_outside_audit_files":bool(references),
                  "webp_counterpart":{
                      "path":sibling,
                      "exists":sibling_path.is_file(),
                      "sha256":sha(sibling_path) if sibling_path.is_file() else None,
                  }
              })

          audit={
              "schema_version":1,
              "audit_date":"2026-10-20",
              "purpose":"Read-only provenance and repository-reference audit for six files held because existing authenticity credentials must not be overwritten.",
              "images_modified":0,
              "targets":len(records),
              "records":records,
          }
          out=ROOT/"studio/protected-provenance-audit-20261020.json"
          out.write_text(json.dumps(audit,indent=2,ensure_ascii=False,sort_keys=True)+"\n")
          print(json.dumps(audit,indent=2,ensure_ascii=False))
          PY

      - name: Verify image files are untouched
        shell: bash
        run: |
          test -z "$(git status --short -- assets/grimoire/grim-thumb.png assets/mapmaker/mapmaker-cover.png assets/vol-one/vol-1-thumbnail.png commission-modal-assets/map-slot-button.png commission-modal-assets/modal-bg.png itch-assets/bookmaker-cover-source.png)"

      - name: Commit audit record only
        shell: bash
        run: |
          git config user.name "L&L Provenance Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add studio/protected-provenance-audit-20261020.json
          git commit -m "audit: record protected provenance source metadata and references"
          git push
