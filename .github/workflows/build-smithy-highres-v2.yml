name: Build Smithy High Resolution V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix_smithy8.py"
      - ".github/workflows/build-smithy-highres-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

# SECURITY HOLD: paid masters/customer downloads must not be published from a public repository.
# Move this generation workflow to private infrastructure before enabling again.
jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Remove Smithy 8 white canvas edge
        run: |
          python scripts/fix_smithy8.py
          cp smithy-8-clean.png assets/smithy/smithy-8.png
      - name: Build masters
        run: python scripts/build_smithy_hires.py
      - name: Enforce white-edge QA
        run: python scripts/qa_smithy_edges.py
      - name: Build site previews
        run: python scripts/build_smithy_site.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/smithy-hires
          git diff --cached --quiet || git commit -m "Build full-bleed high-resolution Smithy assets"
          git pull --rebase origin main
          git push
